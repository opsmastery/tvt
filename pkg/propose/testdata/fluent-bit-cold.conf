# The lab's Fluent Bit pipeline in the classic format (tvt S7 item 3
# fixture), with a cold output.
[SERVICE]
    Flush     1
    Log_Level info

[INPUT]
    Name             tail
    Tag              shop.debug
    Path             /var/log/shop/debug.log
    DB               /var/lib/fluent-bit/tail.db
    Refresh_Interval 5
    Rotate_Wait      10
    Read_from_Head   false
    Mem_Buf_Limit    20MB

# Loki: the shop's debug api stream.
[OUTPUT]
    Name            loki
    Match           shop.debug
    Host            loki
    Port            3100
    Labels          app=shop, component=api, level=debug
    Drop_Single_Key raw

[OUTPUT]
    Name  file
    Alias cold
    Match tvt.cold.*
    Path  /tmp/cold

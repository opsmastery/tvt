# Example tvt config. Copy to ./tvt.yaml (git-ignored). `tvt scan --config tvt.yaml`
# reads external_consumers, ownership, records, slos, runbooks, postmortems, seasons, gaps, pricecard, clients, storage, sweep_share and window_days; the other sections are accepted and read
# by later sprints (backends still come from flags). Unknown keys are errors.
grafana:
  url: http://localhost:3000
  # token: from TVT_GRAFANA_TOKEN
metrics:
  prometheus: http://localhost:9090
  # mimir: http://localhost:9009
logs:
  loki: http://localhost:3100
pricecard: ./pricecard.yaml
# The shortest observation window anything is recommended from: a scan with a
# shorter --window scores every candidate with confidence 0 (default 30).
window_days: 30
# The volume under the Prometheus TSDB (a PVC's requested storage, or df). With
# it, tvt scan warns when retention.size is above 85% of it; without
# retention.size it warns either way. Warnings are evidence gaps, never savings.
storage:
  volume_size: 50Gi

# Kubernetes manifests (helm template output, a GitOps checkout), read from
# disk: tvt resolves which ServiceMonitors and PodMonitors the
# prometheus-operator Prometheus selects, and never attributes series to
# one it doesn't. namespace is helm template's --namespace.
kubernetes:
  manifests: [manifests/]
  namespace: monitoring

# Who sent logged queries, where the log can't say (the Prometheus query log
# records only a client IP). Without grafana, an address that sent a query
# matching a panel or Grafana-managed rule is taken to be Grafana's.
# A query naming no metric that selects more than this share of the series is
# a sweep: weak evidence that keeps nothing on its own (default 0.5).
sweep_share: 0.5

clients:
  grafana: [10.0.0.6]
  agents:
    - name: finance-agent
      user_agent: "^finance-agent/"   # Mimir logs the user agent
      addresses: [10.0.4.0/24]        # Prometheus logs only the IP
      actors: [sa-finance-agent]      # the login its token belongs to (X-Grafana-User)

# Consumers tvt can't see in logs (remote-write targets, federation, external
# tools). Matching signals are treated as hard keeps.
external_consumers:
  - name: finance-federation
    metrics: ["^billing_.*"]
  - name: siem-export
    streams: ['{component="audit"}']

# Records: signals tvt never drops, samples or collapses, whatever their
# readers (ADR 0011). tvt also finds them by name: an audit, deploy-events or
# change-events token in a metric name or a stream label value. A stream
# signal that selects any record stream is protected whole.
records:
  metrics: ["payments_ledger_.*"]
  streams: ['{app="k8s", component="audit"}']

# Who owns which signals, and how critical their service is. First match wins.
# An unread signal of a tier 0 or 1 service is dormant (ask its owner), never a
# drop candidate.
ownership:
  labels: [team, service, namespace]   # recorded; read once series label values are collected
  owners:
    - name: payments
      tier: 0
      metrics: ["shop_payment_.*"]
    - name: shop
      tier: 2
      metrics: ["shop_.*"]
      streams: ['{app="shop"}']

# SLO definitions (Sloth, Pyrra, OpenSLO): files or directories, relative to
# this file. Everything an SLI reads is a hard keep; an SLI tvt can't read
# (a Sloth plugin, a non-Prometheus OpenSLO source) is a recorded gap.
slos:
  paths: [./slos]

# Alert runbooks (runbook_url and other annotation links). A runbook step that
# runs a query (a promql/logql code block, a Grafana Explore or dashboard link)
# makes its signals hard keeps. Links under a mirror's url_prefix are read from
# a local checkout; others are fetched with an unauthenticated GET only when
# fetch is true. Anything tvt can't read is a recorded gap.
# Readers that only run in some months. A window that misses every month of a
# season is a gap, and its services' unread signals are dormant, not drops.
# services are ownership.owners names.
# seasons:
#   - name: quarter close
#     months: [3, 6, 9, 12]
#     services: [finance]

# Evidence gaps you accept, each with a reason (tvt report --config). An
# acknowledged gap leaves the report's rows; an unacknowledged one shows on
# every row it affects, and check fails on it.
gaps:
  acknowledge:
    - source: loki query log
      reason: Loki is only read through Grafana here

# Incident write-ups: an unread metric one names (outside a query) is dormant,
# a question for its owner, never a drop candidate. Files or directories.
postmortems:
  paths: [./postmortems]
runbooks:
  fetch: false
  mirrors:
    - url_prefix: https://github.com/acme/runbooks/blob/main/
      path: ../../runbooks

# Where changes land (ADR 0007). Every signal must be claimed by exactly one
# pipeline; unclaimed or doubly claimed signals are reported, never proposed.
pipelines:
  - name: prometheus-scrape
    kind: prometheus            # prometheus | alloy | otelcol (vector later)
    repo: github.com/acme/observability-config
    branch: main
    files: [prometheus/prometheus.yml]
    handles:                    # label selectors for the signals this pipeline ingests
      - '{job=~"prometheus|loki|grafana|alertmanager"}'
    reviewers: ["@acme/observability"]

  - name: alloy-apps
    kind: alloy
    repo: github.com/acme/observability-config
    branch: main
    files: [alloy/config.alloy]
    checkout: ../observability-config   # optional: a local checkout; tvt scan reads renames and other name rewrites from files there
    handles:
      - '{job=~"shop|node"}'    # metrics scraped by Alloy
      - '{app="shop"}'          # log streams shipped by Alloy
    reviewers: ["@acme/observability"]

  - name: otel-gateway
    kind: otelcol
    repo: gitlab.com/acme/platform-gitops
    branch: main
    # Config rendered from Helm: point at the values key, not the rendered file.
    helm_values:
      file: charts/otel-gateway/values.yaml
      path: config
    version: 0.165.0   # optional: the Collector version; picks the OTTL form tvt writes
    build: otel-gateway/builder-config.yaml   # optional: the ocb manifest of a custom Collector; tvt adds the components it writes
    handles:
      - '{service_namespace="payments"}'
    reviewers: ["@acme/payments-sre"]

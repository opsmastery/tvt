name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make race
      - run: make build
      - run: ./bin/tvt version

  benchmark:
    # The ground-truth benchmark on its own, so a drop in evidence found or
    # in recommendation precision or recall is a named failure on every PR
    # (it also runs inside make race).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make bench

  release-config:
    # The goreleaser config only runs on a tag, so validate it on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  reproducible:
    # Build every release target twice, from two checkouts in different
    # directories, and fail if any binary differs (S12 item 1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: b/nested
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: a/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
          workdir: a
      - run: go clean -cache
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
          workdir: b/nested
      - run: |
          (cd a/dist && find . -type f -name 'tvt*' | sort | xargs sha256sum) > a.sum
          (cd b/nested/dist && find . -type f -name 'tvt*' | sort | xargs sha256sum) > b.sum
          cat a.sum
          diff a.sum b.sum

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          # go-version-input defaults to "stable", which setup-go prefers over
          # go-version-file; clear it so the scan uses go.mod's toolchain, the
          # one releases are built with.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

  secrets:
    # gitleaks over the full history, fixtures included. Uses the release
    # binary: gitleaks-action needs a license key for organization repos.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

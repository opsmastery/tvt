name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make race
      - run: make build
      - run: ./bin/tvt version

  release-config:
    # The goreleaser config only runs on a tag, so validate it on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          # go-version-input defaults to "stable", which setup-go prefers over
          # go-version-file; clear it so the scan uses go.mod's toolchain, the
          # one releases are built with.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

  secrets:
    # gitleaks over the full history, fixtures included. Uses the release
    # binary: gitleaks-action needs a license key for organization repos.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

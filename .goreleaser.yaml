version: 2

builds:
  - main: ./cmd/tvt
    binary: tvt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/Opsmastery-Summit/tvt/internal/version.Version={{.Version}}
      - -X github.com/Opsmastery-Summit/tvt/internal/version.Commit={{.ShortCommit}}
      - -X github.com/Opsmastery-Summit/tvt/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Keyless signing of the checksum file with cosign (Sigstore). Verify with:
#   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/Opsmastery-Summit/tvt/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

changelog:
  sort: asc
# Container image and Helm chart come with continuous mode (Phase 2).

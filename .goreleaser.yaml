version: 2

builds:
  - main: ./cmd/tvt
    binary: tvt
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: no local paths, and every timestamp is the commit's, so
    # two builds of one commit give byte-identical binaries (CI checks it).
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/Opsmastery-Summit/tvt/internal/version.Version={{.Version}}
      - -X github.com/Opsmastery-Summit/tvt/internal/version.Commit={{.ShortCommit}}
      - -X github.com/Opsmastery-Summit/tvt/internal/version.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

# Keyless signing of the checksum file with cosign (Sigstore), as one
# Sigstore bundle: cosign v3 (cosign-installer v4) signs only in the bundle
# format. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/Opsmastery-Summit/tvt/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
# Releases up to v0.1.0-rc1 have checksums.txt.sig and .pem instead.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  # A tag with a pre-release suffix (v0.0.1-rc.1) publishes a pre-release.
  prerelease: auto

changelog:
  sort: asc
# Container image and Helm chart come with continuous mode (Phase 2).

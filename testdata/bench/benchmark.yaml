# The tvt benchmark (S5 item 1): tvt-lab's ground truth, scored on frozen
# fixture snapshots of each lab state. cmd/tvt/benchmark_test.go scans each
# state, builds the report and scores two things separately: evidence found
# (readers, non-readers and query-log sources resolved) and recommendations
# (precision and recall of what the report raises). Recorded scores are in
# baseline.json; any score below them fails the build.
#
# Bump version when the scoring rules change (not when a state or ground
# truth is added), and re-record: go test ./cmd/tvt -run TestBenchmark -update-bench
#
# Each state's dir is captured from the live lab with
#   OUT=testdata/bench/<dir> ./scripts/capture-fixtures.sh
# plus tvt-lab.yaml (copied from testdata/lab). A state with a base is an
# overlay: only the files that changed, laid over the base's.
# Version 2 (S5 item 3): recommendations also score line findings against
# ground truth's line_patterns.
# Version 3 (S5 debug pass): a stream recommendation whose selector selects
# a stream ground truth keeps is a false positive for each such stream.
version: 3
states:
  - name: before-deploy
    dir: before
    scan_time: 2026-11-15T03:22:30Z
    about: >
      tvt-lab with the S5 distractors (shop_cart_operation_total, the reconciler's
      error stream, panel 9's ${counter} variable) and the startup burst, captured
      Nov 15, 2026 03:22 UTC.
    proven: [prometheus query log, loki query log, grafana router log]
  - name: after-deploy
    dir: after
    base: before-deploy
    scan_time: 2026-11-15T03:37:30Z
    about: >
      Right after the deploy that added ShopHealthcheckSlow (tvt-lab #16, loaded 03:35 UTC):
      shop_healthcheck_duration_seconds_bucket gains a reader and is a hard keep. The
      overlay is the Prometheus rules API answer and the ground truth captured at 03:37;
      every other fixture is the before-deploy one.
    proven: [prometheus query log, loki query log, grafana router log]
  - name: rule-efficiency
    dir: rules
    scan_time: 2026-11-15T20:55:30Z
    about: >
      After the rule-efficiency seeds (tvt-lab #17, #18; tvt Sprint 2 item 12): a Grafana-managed
      LogQL alert parsing raw logs every 30s, its well-built Loki recording rule version, a [24h]
      window every minute, a 5s group on a 10s scrape, an alert on a metric that never existed and a
      duplicate alert. Full snapshot captured Nov 15, 2026 20:54 UTC; ground truth's rule_findings
      is scored by TestRuleFindings (S6 item 1).
    proven: [prometheus query log, loki query log, grafana router log]
  - name: slo-coverage
    dir: slo
    base: rule-efficiency
    scan_time: 2026-11-15T21:50:30Z
    about: >
      After the SLO coverage seeds (tvt-lab #19; tvt S6 item 3): the shop availability Sloth SLO and
      its multiwindow burn-rate page alert ShopAvailabilityBurn, loaded 21:3x UTC. The overlay is the
      Prometheus rules API answer captured at 21:50, the new SLO file, the ground truth and a
      tvt-lab.yaml naming the lab's services as owners; every other fixture is the rule-efficiency
      one. Ground truth's slo_coverage is scored by TestSLOCoverage.
    proven: [prometheus query log, loki query log, grafana router log]
  - name: pipelines
    dir: pipelines
    scan_time: 2026-11-15T22:52:00Z
    about: >
      After Alloy joined the data path (tvt-lab #20; tvt S6 item 4): Alloy scrapes the shop and
      node-exporter and ships the shop's logs, Prometheus scrapes itself and the backends, and the
      reconciler's stream goes straight to Loki. Full snapshot captured Nov 15, 2026 22:51 UTC with
      prometheus/label_metrics.json; tvt-lab.yaml declares both pipelines. Ground truth's pipelines
      is scored by TestPipelineTargets.
    proven: [prometheus query log, loki query log, grafana router log]
  - name: overflow
    dir: overflow
    scan_time: 2026-11-16T00:24:30Z
    about: >
      After the overflow seed (tvt-lab #24; tvt S6 item 5): the shop's spans go through Alloy's
      spanmetrics connector with customer.id as a dimension and a cardinality limit of 100, so the
      traces_span_metrics_* metrics carry otel_metric_overflow="true" series, and the viewer's ad hoc
      customer lookup filters on the capped customer_id. Full snapshot captured Nov 16, 2026 00:24 UTC
      with prometheus/overflow.json. Ground truth's overflow is scored by TestOverflow.
    proven: [prometheus query log, loki query log, grafana router log]
